name: Publish validated web artifact
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: app-web-production
      cancel-in-progress: false
    env:
      SOURCE_SHA: c6a2802507fbd8d92909029d8d2f5af896eeb63a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c6a2802507fbd8d92909029d8d2f5af896eeb63a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: little-graduates-web-bda55749d031a43eaf5c1c457ea81fd4c0cf901f
          run-id: 40158451656
          github-token: ${{ github.token }}
          path: release-files
      - name: Publish the tested static release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init --quiet release-repo
          git -C release-repo remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -C release-repo ls-remote --exit-code --heads origin web-release; then
            git -C release-repo fetch --depth=1 origin web-release
            git -C release-repo checkout -b web-release FETCH_HEAD
          else
            git -C release-repo checkout --orphan web-release
          fi
          rsync -a --delete --exclude=.git/ release-files/ release-repo/
          echo "$SOURCE_SHA" > release-repo/build-id.txt
          cat > release-repo/.cpanel.yml <<'CPANEL'
          deployment:
            tasks:
              - /usr/bin/rsync -av --checksum --no-perms --omit-dir-times --exclude='.git/' --exclude='.cpanel.yml' ./ $HOME/thelittlegraduates.in/app/ > $HOME/last-app-deploy.log 2>&1
              - /usr/bin/find $HOME/thelittlegraduates.in/app -type d -exec /bin/chmod 755 {} +
              - /usr/bin/find $HOME/thelittlegraduates.in/app -type f -exec /bin/chmod 644 {} +
          CPANEL
          git -C release-repo add --all
          git -C release-repo -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit --allow-empty -m "Deploy app $SOURCE_SHA"
          git -C release-repo push origin HEAD:web-release
      - name: Deploy isolated app directory and verify HTTPS
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          SOURCE_SHA: c6a2802507fbd8d92909029d8d2f5af896eeb63a
        run: python3 scripts/cpanel_web_deploy.py
